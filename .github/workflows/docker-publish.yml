name: Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: true
          tags: necropion/fit_bud-frontend:latest

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./Services
          push: true
          tags: necropion/fit_bud-gateway:latest

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./Services
          push: true
          tags: necropion/fit_bud-authentication:latest
          
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./Services
          push: true
          tags: necropion/fit_bud-training:latest
